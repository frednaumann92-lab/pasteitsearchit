<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Center v2</title>

<style>
  body {
    margin: 0;
    font-family: monospace;
    background: #070a0f;
    color: #d7dde8;
  }

  header {
    background: #0f1622;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f2a3a;
  }

  #feed {
    height: 72vh;
    overflow-y: auto;
    padding: 12px;
    background: #0a0f18;
  }

  .msg {
    padding: 8px;
    margin-bottom: 6px;
    border-left: 3px solid #2b6cff;
    background: rgba(255,255,255,0.03);
  }

  .user {
    color: #4dd0e1;
    font-weight: bold;
  }

  .time {
    color: #666;
    font-size: 0.8em;
    margin-left: 6px;
  }

  #inputBar {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #0f1622;
    border-top: 1px solid #1f2a3a;
  }

  input, button {
    font-family: monospace;
    border: none;
    border-radius: 6px;
    padding: 10px;
  }

  input {
    background: #141c2b;
    color: #fff;
  }

  #usernameBox {
    width: 140px;
  }

  #msgInput {
    flex: 1;
  }

  button {
    background: #d32f2f;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #a82525;
  }
</style>
</head>

<body>

<header>
  <div>🛰 Command Center v2</div>
  <div>
    User:
    <input id="usernameBox" placeholder="operator name" />
  </div>
</header>

<div id="feed"></div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type message or /command..." />
  <button id="sendBtn">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "messages");

const feed = document.getElementById("feed");
const input = document.getElementById("msgInput");
const usernameBox = document.getElementById("usernameBox");

let lastKey = null;
const messageKeys = [];

/* USERNAME MEMORY */
usernameBox.value = localStorage.getItem("cmd_user") || "";

usernameBox.addEventListener("input", () => {
  localStorage.setItem("cmd_user", usernameBox.value.trim());
});

/* SANITIZE */
function clean(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

/* RENDER */
function addMessage(data, key) {
  const div = document.createElement("div");
  div.className = "msg";

  const time = new Date(data.time).toLocaleTimeString();

  div.innerHTML = `
    <span class="user">${clean(data.user)}</span>
    <span class="time">[${time}]</span><br>
    ${clean(data.text)}
  `;

  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;

  messageKeys.push(key);
  lastKey = key;
}

/* LIVE STREAM */
onChildAdded(messagesRef, (snap) => {
  addMessage(snap.val(), snap.key);
});

/* COMMAND HANDLER */
function handleCommand(text) {
  const cmd = text.toLowerCase();

  if (cmd === "/clear") {
    feed.innerHTML = "";
    return true;
  }

  if (cmd === "/del last") {
    if (lastKey) {
      remove(ref(db, "messages/" + lastKey));
      feed.lastChild?.remove();
    }
    return true;
  }

  if (cmd === "/wipe") {
    remove(messagesRef);
    feed.innerHTML = "";
    return true;
  }

  return false;
}

/* SEND */
function send() {
  const user = usernameBox.value.trim() || "anon";
  const text = input.value.trim();

  if (!text) return;

  if (handleCommand(text)) {
    input.value = "";
    return;
  }

  push(messagesRef, {
    user,
    text,
    time: Date.now()
  });

  input.value = "";
}

document.getElementById("sendBtn").onclick = send;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
