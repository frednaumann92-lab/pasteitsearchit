<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save and Search</title>

<style>
  body {
    font-family: monospace;
    max-width: 900px;
    margin: 20px auto 80px;
    background: #f0f4f8;
    color: #000;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
  }
  body.dark { background:#121212; color:#eee; }
  h1 { margin-bottom: 10px; }
  label { font-weight:bold; user-select:none; }

  textarea, input[type=text] {
    width:100%;
    font-family: monospace;
    font-size:1em;
    padding:8px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
    background:inherit;
    color:inherit;
    box-sizing:border-box;
  }

  body.dark textarea, body.dark input[type=text] {
    border-color:#555;
    background:#222;
  }

  textarea { height:180px; resize:vertical; }

  button {
    background:#d32f2f;
    border:none;
    color:white;
    padding:7px 14px;
    margin:5px 5px 10px 0;
    border-radius:6px;
    cursor:pointer;
  }

  button:hover { background:#9a2222; }

  #results {
    background:#fff;
    border:1px solid #ccc;
    padding:10px;
    border-radius:6px;
    max-height:320px;
    overflow-y:auto;
    white-space:pre-wrap;
  }

  body.dark #results { background:#222; border-color:#555; }

  #clock {
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    font-size:3em;
    background:#eee;
    padding:6px 12px;
    border-radius:12px;
  }

  body.dark #clock { background:#333; color:#ddd; }

  .highlight0{background:#ffeb3b;}
  .highlight1{background:#8bc34a;}
  .highlight2{background:#03a9f4;}
  .highlight3{background:#e91e63;}
  .highlight4{background:#ff9800;}
  .highlight5{background:#9c27b0;}
</style>
</head>

<body>

<h1>Save and Search (LIVE)</h1>

<textarea id="pasteArea"></textarea>

<input id="searchTerm" placeholder="Search terms..." />

<button id="clearSearchBtn">Clear</button>
<button id="copyResultsBtn">Copy</button>
<button id="exportBtn">Export</button>
<button id="printBtn">Print</button>

<div id="results"></div>
<div id="clock">00:00:00</div>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const sharedRef = ref(db, "sharedText");

const pasteArea = document.getElementById("pasteArea");
const searchTerm = document.getElementById("searchTerm");
const results = document.getElementById("results");

let localChange = false;

/* LIVE LOAD */
onValue(sharedRef, (snap) => {
  const data = snap.val();
  if (data !== null && !localChange) {
    pasteArea.value = data;
    runSearch();
  }
});

/* SAVE */
pasteArea.addEventListener("input", () => {
  localChange = true;
  set(sharedRef, pasteArea.value);
  setTimeout(() => localChange = false, 200);
  runSearch();
});

/* SEARCH */
function runSearch() {
  const text = pasteArea.value;
  const terms = searchTerm.value.split(",").map(t => t.trim()).filter(Boolean);

  const lines = text.split("\n").filter(line =>
    terms.some(t => line.toLowerCase().includes(t.toLowerCase()))
  );

  results.innerHTML = lines.length
    ? lines.join("\n")
    : "No matches";
}

searchTerm.addEventListener("input", runSearch);

/* CLOCK */
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toTimeString().split(" ")[0];
}, 1000);
</script>

</body>
</html>
