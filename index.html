<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Network v4.2</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #070a0f;
  color: #d7dde8;
}

/* HEADER */
header {
  background: #0f1622;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid #1f2a3a;
}

/* LAYOUT */
#layout {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  height: 85vh;
}

/* MOBILE */
@media (max-width: 800px) {
  #layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }

  #channels {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    border-right: none;
    border-bottom: 1px solid #1f2a3a;
  }

  #radar {
    max-height: 160px;
  }
}

/* CHANNELS */
#channels {
  background: #0a0f18;
  border-right: 1px solid #1f2a3a;
  padding: 10px;
}

.channel {
  padding: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
}

/* FEED */
#feed {
  overflow-y: auto;
  padding: 10px;
  background: #0c111c;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #2b6cff;
  background: rgba(255,255,255,0.03);
}

/* RADAR */
#radar {
  background: #0a0f18;
  border-left: 1px solid #1f2a3a;
  padding: 10px;
  font-size: 12px;
  color: #4dd0e1;
  overflow-y: auto;
}

/* INPUT BAR FIXED WIDTH */
#inputBar {
  display: flex;
  gap: 6px;
  padding: 10px;
  background: #0f1622;
  border-top: 1px solid #1f2a3a;
  position: sticky;
  bottom: 0;
}

input, button, select {
  font-family: monospace;
  border: none;
  border-radius: 6px;
  padding: 10px;
}

input {
  background: #141c2b;
  color: #fff;
}

#msgInput {
  flex: 1;
  min-width: 250px;
}

button {
  background: #d32f2f;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div>🛰 Command Network v4.2</div>

  <div style="display:flex; gap:6px; flex-wrap:wrap;">
    <input id="usernameBox" placeholder="operator" style="width:120px;" />

    <select id="roleBox">
      <option value="operator">operator</option>
      <option value="admin">admin</option>
      <option value="guest">guest</option>
    </select>

    <button id="muteBtn">🔊</button>
  </div>
</header>

<div id="layout">
  <div id="channels">
    <div class="channel" data-ch="alpha"># alpha</div>
    <div class="channel" data-ch="bravo"># bravo</div>
    <div class="channel" data-ch="charlie"># charlie</div>
    <div class="channel" data-ch="broadcast"># broadcast</div>
  </div>

  <div id="feed"></div>
  <div id="radar">🟢 INIT...</div>
</div>

<div id="inputBar">
  <input id="msgInput" placeholder="message or /command..." />
  <button id="sendBtn">SEND</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove,
  set,
  onDisconnect,
  onValue,
  off
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
});

const db = getDatabase(app);

/* STATE */
let channel = "alpha";
let sound = true;

/* UI */
const feed = document.getElementById("feed");
const input = document.getElementById("msgInput");
const userBox = document.getElementById("usernameBox");
const roleBox = document.getElementById("roleBox");
const radar = document.getElementById("radar");

/* AUDIO */
const ctx = new (window.AudioContext || window.webkitAudioContext)();
function tone(f,d,t="sine",v=0.05){
  if(!sound) return;
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.frequency.value=f;
  o.type=t;
  g.gain.value=v;
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),d);
}
const sSend=()=>tone(520,60,"square");
const sRecv=()=>tone(880,80);
const sCmd=()=>tone(660,90,"triangle");
const sAlert=()=>tone(120,300,"sawtooth",0.08);

/* CLEAN */
const clean = s => String(s).replaceAll("<","&lt;").replaceAll(">","&gt;");

/* CHANNEL */
const messagesRef = ch => ref(db,"channels/"+ch);

/* PRESENCE */
const myId = crypto.randomUUID?.() || String(Date.now());
const presenceRef = ref(db,"presence/"+myId);

function updatePresence(){
  const name = userBox.value.trim() || "anon";
  const role = roleBox.value;

  set(presenceRef,{
    user:name,
    role,
    channel,
    status:"online",
    t:Date.now()
  });

  onDisconnect(presenceRef).set({
    user:name,
    role,
    channel,
    status:"offline",
    t:Date.now()
  });
}

userBox.addEventListener("input", updatePresence);
roleBox.addEventListener("change", updatePresence);
updatePresence();

/* RADAR */
onValue(ref(db,"presence"),snap=>{
  const d=snap.val()||{};
  const online=Object.values(d).filter(u=>u.status==="online");

  radar.innerHTML=
    "🟢 ONLINE OPS ("+online.length+")<br><br>"+
    online.map(u=>`• ${clean(u.user)} [${u.role}] (${u.channel})`).join("<br>");
});

/* CHANNEL SWITCH */
document.querySelectorAll(".channel").forEach(el=>{
  el.onclick=()=>{
    channel=el.dataset.ch;

    // FIX: properly detach previous listener
    if (window.currentListenerRef) {
      off(window.currentListenerRef);
    }

    feed.innerHTML="";
    listen();
    updatePresence();
  };
});

/* MESSAGES */
let lastKey=null;
window.currentListenerRef = null;

function listen(){
  window.currentListenerRef = messagesRef(channel);

  onChildAdded(window.currentListenerRef, snap=>{
    const d=snap.val();

    const div=document.createElement("div");
    div.className="msg";

    div.innerHTML=
      `<b>${clean(d.user)}</b> [${d.channel}]<br>${clean(d.text)}`;

    feed.appendChild(div);
    feed.scrollTop=feed.scrollHeight;

    lastKey=snap.key;
    sRecv();
  });
}
listen();

/* COMMANDS */
function cmd(t){
  const c=t.toLowerCase();

  if(c==="/clear"){
    feed.innerHTML="";
    return true;
  }

  if(c==="/wipe"&&roleBox.value==="admin"){
    sAlert();
    remove(ref(db,"channels/"+channel));
    feed.innerHTML="";
    return true;
  }

  if(c.startsWith("/channel ")){
    channel=c.split(" ")[1];

    if (window.currentListenerRef) {
      off(window.currentListenerRef);
    }

    feed.innerHTML="";
    listen();
    updatePresence();
    return true;
  }

  return false;
}

/* SEND */
function send(){
  const text=input.value.trim();
  if(!text)return;

  if(cmd(text)){sCmd();input.value="";return;}

  push(messagesRef(channel),{
    user:userBox.value||"anon",
    role:roleBox.value,
    channel,
    text,
    t:Date.now()
  });

  sSend();
  input.value="";
}

document.getElementById("sendBtn").onclick=send;
input.addEventListener("keydown",e=>e.key==="Enter"&&send());

/* MUTE */
document.getElementById("muteBtn").onclick=()=>{
  sound=!sound;
  document.getElementById("muteBtn").textContent=sound?"🔊":"🔇";
};
</script>

</body>
</html>
