<script>
const feed = document.getElementById("feed");
const input = document.getElementById("cmd-input");
const usersGrid = document.getElementById("users-grid");

/* ================= CLEAN ================= */
function clean(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4mIxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

/* ================= IDENTITY SYSTEM ================= */
const myId = localStorage.getItem("op_id") || crypto.randomUUID();
localStorage.setItem("op_id", myId);

/* LIVE USERNAME (NOW EDITABLE) */
let username = localStorage.getItem("op_name") || "OP_ACTIVE";

/* ================= UI ADD: USERNAME CONTROL ================= */
const nameBar = document.createElement("div");
nameBar.style.cssText = `
  position: fixed;
  top: 8px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  padding: 6px;
  border-radius: 6px;
  font-family: monospace;
  z-index: 9999;
`;

nameBar.innerHTML = `
  <span style="color:#00ff66">USER:</span>
  <input id="nameInput" style="width:120px;background:#111;color:#fff;border:none;padding:4px;" />
`;

document.body.appendChild(nameBar);

const nameInput = document.getElementById("nameInput");
nameInput.value = username;

/* ================= PRESENCE ================= */
const presenceRef = database.ref("present_users/" + myId);

/* update presence whenever username changes */
function updatePresence() {
  presenceRef.set({
    username,
    status: "online",
    t: Date.now()
  });
}

presenceRef.onDisconnect().set({
  username,
  status: "offline",
  t: Date.now()
});

/* typing username updates LIVE */
nameInput.addEventListener("input", () => {
  username = nameInput.value.trim() || "OP_ACTIVE";
  localStorage.setItem("op_name", username);
  updatePresence();
});

/* init presence */
updatePresence();

/* ================= MESSAGES ================= */
function renderIncomingMessage(user, text, timeStr) {
  const msgDiv = document.createElement("div");
  msgDiv.className = "msg";

  msgDiv.innerHTML = `
    <div class="msg-meta">
      <span class="user">${clean(user)}</span>
      <span class="time">${timeStr}</span>
    </div>
    <div class="text-payload">${clean(text)}</div>
  `;

  feed.appendChild(msgDiv);
  feed.scrollTop = feed.scrollHeight;
}

/* realtime messages */
database.ref("messages").on("child_added", snap => {
  const d = snap.val();
  if (!d) return;

  renderIncomingMessage(
    d.username || "UNKNOWN_OP",
    d.text || "",
    d.timestamp || ""
  );
});

/* ================= PRESENCE PANEL ================= */
database.ref("present_users").on("value", snap => {
  usersGrid.innerHTML = `
    <li class="operator-item">
      <span class="status-dot"></span>
      <span>${clean(username)} (You)</span>
    </li>
  `;

  snap.forEach(child => {
    const u = child.val();
    if (!u || child.key === myId) return;

    const li = document.createElement("li");
    li.className = "operator-item";
    li.innerHTML = `
      <span class="status-dot"></span>
      <span>${clean(u.username)}</span>
    `;
    usersGrid.appendChild(li);
  });
});

/* ================= COMMANDS ================= */
async function handleCommand(text, timestamp) {
  const cmd = text.trim().toLowerCase();

  if (cmd === "/clear") {
    feed.innerHTML = "";
    return true;
  }

  if (cmd === "/wipe") {
    database.ref("messages").remove();
    feed.innerHTML = "";
    return true;
  }

  return false;
}

/* ================= SEND ================= */
input.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;

  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  const timestamp = new Date().toLocaleTimeString();

  const isCommand = await handleCommand(text, timestamp);

  if (!isCommand) {
    database.ref("messages").push({
      username,
      text,
      timestamp
    });
  }
});
</script>
