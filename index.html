<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Network v6 Stable Core</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #070a0f;
  color: #d7dde8;
}

header {
  background: #0f1622;
  padding: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid #1f2a3a;
}

#layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 85vh;
}

#channels {
  background: #0a0f18;
  padding: 10px;
  border-right: 1px solid #1f2a3a;
}

.channel {
  padding: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
}

#feed {
  padding: 10px;
  overflow-y: auto;
  background: #0c111c;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #2b6cff;
  background: rgba(255,255,255,0.03);
}

#inputBar {
  display: flex;
  padding: 10px;
  gap: 6px;
  background: #0f1622;
  border-top: 1px solid #1f2a3a;
}

input, button {
  font-family: monospace;
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input {
  background: #141c2b;
  color: white;
  flex: 1;
}

button {
  background: #2b6cff;
  color: white;
  cursor: pointer;
}

#status {
  margin-left: auto;
  padding: 4px 8px;
  background: #111a2a;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <div>🛰 Command Network v6 Core</div>
  <div id="status">connecting...</div>
</header>

<div id="layout">

  <div id="channels">
    <div class="channel" data-ch="alpha"># alpha</div>
    <div class="channel" data-ch="bravo"># bravo</div>
    <div class="channel" data-ch="charlie"># charlie</div>
  </div>

  <div id="feed"></div>

</div>

<div id="inputBar">
  <input id="msg" placeholder="message or /wipe" />
  <button id="send">SEND</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307"
});

const db = getDatabase(app);
const auth = getAuth(app);

/* ONLY CONTROL MECHANISM (no roles, no confusion) */
const ALLOWED_COMMAND_UIDS = [
  "uiXgz4sgYfo5TjSl1uLc9Xmypk7Xv1"
];

let user = null;
let channel = "alpha";
let unsubscribe = null;

/* UI */
const feed = document.getElementById("feed");
const msg = document.getElementById("msg");
const status = document.getElementById("status");

const messagesRef = ch => ref(db, "channels/" + ch);

/* AUTH */
onAuthStateChanged(auth, u => {
  user = u;

  if (!u) {
    status.textContent = "offline";
    return;
  }

  status.textContent = `online: ${u.uid.slice(0,6)}`;
  listen();
});

/* AUTO LOGIN (no UI dead states) */
signInAnonymously(auth);

/* LISTENER (clean + safe) */
function listen() {
  if (unsubscribe) unsubscribe();
  feed.innerHTML = "";

  unsubscribe = onChildAdded(messagesRef(channel), snap => {
    const d = snap.val();

    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${d.user}</b><br>${d.text}`;

    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  });
}

/* CHANNEL SWITCH */
document.querySelectorAll(".channel").forEach(el => {
  el.onclick = () => {
    channel = el.dataset.ch;
    listen();
  };
});

/* SEND */
async function send() {
  if (!user) return;

  const text = msg.value.trim();
  if (!text) return;

  /* COMMAND SYSTEM */
  if (text === "/wipe") {
    if (!ALLOWED_COMMAND_UIDS.includes(user.uid)) {
      alert("Not allowed");
      msg.value = "";
      return;
    }

    try {
      await remove(messagesRef(channel));
      feed.innerHTML = "";
    } catch (e) {
      console.error("wipe failed:", e);
    }

    msg.value = "";
    return;
  }

  await push(messagesRef(channel), {
    user: user.uid.slice(0, 6),
    text,
    t: Date.now()
  });

  msg.value = "";
}

document.getElementById("send").onclick = send;

msg.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
