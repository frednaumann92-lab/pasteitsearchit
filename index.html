<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Network Debug Core</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #05070c;
  color: #d7dde8;
}

header {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px;
  background: #0f1622;
  border-bottom: 1px solid #1f2a3a;
}

#layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 85vh;
}

#channels {
  background: #0a0f18;
  padding: 10px;
  border-right: 1px solid #1f2a3a;
}

.channel {
  padding: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
}

#feed {
  padding: 10px;
  overflow-y: auto;
  background: #0c111c;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #2b6cff;
  background: rgba(255,255,255,0.03);
}

#inputBar {
  display: flex;
  gap: 6px;
  padding: 10px;
  background: #0f1622;
  border-top: 1px solid #1f2a3a;
}

input, button {
  font-family: monospace;
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input {
  flex: 1;
  background: #141c2b;
  color: white;
}

button {
  background: #2b6cff;
  color: white;
  cursor: pointer;
}

#status {
  margin-left: auto;
}

#debug {
  padding: 8px;
  font-size: 12px;
  color: #ffcc66;
}
</style>
</head>

<body>

<header>
  <div>🛰 Debug Command Network</div>
  <div id="status">loading...</div>
</header>

<div id="debug">debug: waiting...</div>

<div id="layout">

  <div id="channels">
    <div class="channel" data-ch="alpha"># alpha</div>
    <div class="channel" data-ch="bravo"># bravo</div>
    <div class="channel" data-ch="charlie"># charlie</div>
  </div>

  <div id="feed"></div>

</div>

<div id="inputBar">
  <input id="msg" placeholder="type message or /wipe" />
  <button id="send">SEND</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* Firebase */
const app = initializeApp({
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307"
});

const db = getDatabase(app);
const auth = getAuth(app);

/* ONLY CONTROL */
const ALLOWED_UIDS = [
  "uiXgz4sgYfo5TjSl1uLc9Xmypk7Xv1"
];

let user = null;
let channel = "alpha";

const feed = document.getElementById("feed");
const msg = document.getElementById("msg");
const status = document.getElementById("status");
const debug = document.getElementById("debug");

const refPath = () => ref(db, "channels/" + channel);

/* AUTH */
onAuthStateChanged(auth, u => {
  user = u;

  if (!u) {
    status.textContent = "offline";
    return;
  }

  status.textContent = u.uid.slice(0, 8);

  listen();
});

signInAnonymously(auth);

/* LISTEN */
function listen() {
  onValue(refPath(), snap => {
    const data = snap.val() || {};
    feed.innerHTML = "";

    Object.values(data).forEach(m => {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<b>${m.user}</b><br>${m.text}`;
      feed.appendChild(div);
    });
  });
}

/* CHANNEL SWITCH */
document.querySelectorAll(".channel").forEach(el => {
  el.onclick = () => {
    channel = el.dataset.ch;
    listen();
  };
});

/* SEND */
async function send() {
  if (!user) return;

  const text = msg.value.trim();
  if (!text) return;

  const r = refPath();

  if (text === "/wipe") {

    debug.textContent = "wipe requested...";

    if (!ALLOWED_UIDS.includes(user.uid)) {
      debug.textContent = "wipe blocked: UID not allowed";
      msg.value = "";
      return;
    }

    try {
      await remove(r);
      debug.textContent = "wipe SUCCESS";
    } catch (e) {
      debug.textContent = "wipe FAILED: " + e.message;
      console.error(e);
    }

    msg.value = "";
    return;
  }

  await push(r, {
    user: user.uid.slice(0, 6),
    text,
    t: Date.now()
  });

  msg.value = "";
}

document.getElementById("send").onclick = send;

msg.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
