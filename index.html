<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Center v1</title>

<style>
  body {
    font-family: monospace;
    margin: 0;
    background: #0f1115;
    color: #e6e6e6;
  }

  header {
    padding: 10px;
    background: #151924;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #feed {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
    background: #0b0d12;
  }

  .msg {
    padding: 6px;
    border-bottom: 1px solid #222;
  }

  .user {
    color: #4dd0e1;
    font-weight: bold;
  }

  .time {
    color: #777;
    font-size: 0.8em;
  }

  #inputBar {
    display: flex;
    gap: 5px;
    padding: 10px;
    background: #151924;
  }

  input, button {
    font-family: monospace;
    padding: 8px;
    border-radius: 6px;
    border: none;
  }

  input {
    flex: 1;
    background: #1c2230;
    color: #fff;
  }

  button {
    background: #d32f2f;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #9a2222;
  }

  #usernameBox {
    width: 150px;
  }
</style>
</head>

<body>

<header>
  <div>🛰 Command Center v1</div>
  <div>
    User:
    <input id="usernameBox" placeholder="name" />
  </div>
</header>

<div id="feed"></div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type command or message..." />
  <button id="sendBtn">Send</button>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "messages");

const feed = document.getElementById("feed");
const input = document.getElementById("msgInput");
const usernameBox = document.getElementById("usernameBox");

/* LOAD NAME */
if (localStorage.getItem("cmd_user")) {
  usernameBox.value = localStorage.getItem("cmd_user");
}

usernameBox.addEventListener("input", () => {
  localStorage.setItem("cmd_user", usernameBox.value);
});

/* RENDER MESSAGE */
function addMessage(data) {
  const div = document.createElement("div");
  div.className = "msg";

  const time = new Date(data.time).toLocaleTimeString();

  div.innerHTML = `
    <span class="user">${data.user}</span>
    <span class="time">[${time}]</span><br>
    ${data.text}
  `;

  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

/* LIVE LISTEN */
onChildAdded(messagesRef, (snap) => {
  addMessage(snap.val());
});

/* SEND MESSAGE */
function send() {
  const user = usernameBox.value.trim() || "anon";
  const text = input.value.trim();

  if (!text) return;

  push(messagesRef, {
    user,
    text,
    time: Date.now()
  });

  input.value = "";
}

document.getElementById("sendBtn").onclick = send;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
