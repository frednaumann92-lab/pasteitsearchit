<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Network v4.5 Login Stable</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #070a0f;
  color: #d7dde8;
}

header {
  background: #0f1622;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid #1f2a3a;
}

#layout {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  height: 85vh;
}

#channels {
  background: #0a0f18;
  padding: 10px;
  border-right: 1px solid #1f2a3a;
}

.channel {
  padding: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
}

#feed {
  padding: 10px;
  overflow-y: auto;
  background: #0c111c;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #2b6cff;
  background: rgba(255,255,255,0.03);
}

#radar {
  background: #0a0f18;
  padding: 10px;
  border-left: 1px solid #1f2a3a;
}

#inputBar {
  display: flex;
  padding: 10px;
  gap: 6px;
  background: #0f1622;
  border-top: 1px solid #1f2a3a;
  position: sticky;
  bottom: 0;
}

input, button {
  font-family: monospace;
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input {
  background: #141c2b;
  color: white;
  flex: 1;
}

button {
  background: #d32f2f;
  color: white;
}

#loginBox {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<header>
  <div>🛰 Command Network v4.5 Login Stable</div>

  <div id="loginBox">
    <input id="email" placeholder="email" />
    <input id="pass" type="password" placeholder="password" />
    <button id="loginBtn">Login</button>
    <button id="anonBtn">Guest</button>
    <button id="logoutBtn">Logout</button>

    <span id="status">🔄 connecting...</span>
  </div>
</header>

<div id="layout">
  <div id="channels">
    <div class="channel" data-ch="alpha"># alpha</div>
    <div class="channel" data-ch="bravo"># bravo</div>
    <div class="channel" data-ch="charlie"># charlie</div>
  </div>

  <div id="feed"></div>
  <div id="radar">🟢 ready</div>
</div>

<div id="inputBar">
  <input id="msg" placeholder="message..." />
  <button id="send">SEND</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signInAnonymously,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307"
});

const db = getDatabase(app);
const auth = getAuth(app);

/* ADMIN */
const ADMIN_UIDS = [
  "j4KFCYgFz0UR6n2NF2ZdLkwUfkm1"
];

let channel = "alpha";
let user = null;

const feed = document.getElementById("feed");
const msg = document.getElementById("msg");
const status = document.getElementById("status");

/* AUTH SAFE STATE (NO AUTO CONFLICT) */
onAuthStateChanged(auth, u => {
  user = u;

  if (!u) {
    status.textContent = "🔴 logged out";
    return;
  }

  const role = u.isAnonymous
    ? "guest"
    : (ADMIN_UIDS.includes(u.uid) ? "admin" : "operator");

  status.textContent = `🟢 ${role}`;

  listen();
});

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  await signInWithEmailAndPassword(
    auth,
    document.getElementById("email").value,
    document.getElementById("pass").value
  );
};

/* GUEST LOGIN */
document.getElementById("anonBtn").onclick = () => {
  signInAnonymously(auth);
};

/* LOGOUT */
document.getElementById("logoutBtn").onclick = () => signOut(auth);

/* DB */
const messagesRef = ch => ref(db, "channels/" + ch);

/* LISTEN */
function listen() {
  feed.innerHTML = "";

  onChildAdded(messagesRef(channel), snap => {
    const d = snap.val();

    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${d.user}</b><br>${d.text}`;

    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  });
}

/* CHANNELS */
document.querySelectorAll(".channel").forEach(el => {
  el.onclick = () => {
    channel = el.dataset.ch;
    listen();
  };
});

/* SEND */
function send() {
  if (!user) return;

  const text = msg.value.trim();
  if (!text) return;

  push(messagesRef(channel), {
    user: user.email || "guest",
    text,
    t: Date.now()
  });

  msg.value = "";
}

document.getElementById("send").onclick = send;

/* ENTER KEY */
msg.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
