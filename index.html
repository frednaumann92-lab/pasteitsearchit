<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Command Deck</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-main: #0d0e12;
      --bg-panel: #16171d;
      --border-color: #262930;
      --text-main: #e2e4e9;
      --text-muted: #626775;
      --accent-green: #00ff66;
      --accent-purple: #bc6ff1;
      --accent-red: #ff3333;
    }
    
    .theme-matrix {
      --bg-main: #020202;
      --bg-panel: #050805;
      --border-color: #0f2d11;
      --text-main: #33ff33;
      --text-muted: #145a19;
      --accent-green: #33ff33;
      --accent-purple: #00ff66;
    }

    .theme-cyber {
      --bg-main: #0e0014;
      --bg-panel: #1a0026;
      --border-color: #ff0055;
      --text-main: #00f0ff;
      --text-muted: #730046;
      --accent-green: #00f0ff;
      --accent-purple: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px;
      transition: background-color 0.2s, color 0.2s;
    }
    
    #workspace {
      display: flex;
      flex: 1;
      gap: 10px;
      margin-bottom: 10px;
      min-height: 0;
    }

    #feed {
      flex: 3;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    #online-panel {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      font-weight: bold;
      color: var(--accent-green);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      margin-bottom: 10px;
      font-size: 0.9em;
    }

    .operator-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9em;
    }

    .operator-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
    }

    .msg {
      margin-bottom: 12px;
      line-height: 1.5;
      padding-left: 8px;
    }
    .msg-meta {
      font-size: 0.85em;
      margin-bottom: 3px;
    }
    .user { color: var(--accent-green); font-weight: bold; }
    .time { color: var(--text-muted); margin-left: 8px; }
    .text-payload { white-space: pre-wrap; word-break: break-word; }
    .sys-alert { color: var(--accent-purple); }
    
    #console-bar {
      display: flex;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      align-items: center;
    }
    #prompt-indicator {
      color: var(--accent-green);
      font-weight: bold;
      margin-right: 10px;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1em;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="workspace">
    <div id="feed">
      <div class="msg">
        <div class="msg-meta"><span class="user">[SYSTEM]</span><span class="time">CORE_READY</span></div>
        <div class="text-payload sys-alert">>> Secure network array recovered. Connecting to synchronized relay server...</div>
        <div class="text-payload sys-alert">>> Operational: /ai [prompt] | /theme [matrix/cyber/default] | /clear | /wipe</div>
      </div>
    </div>

    <div id="online-panel">
      <div class="panel-header">ACTIVE_OPERATORS</div>
      <ul id="users-grid" class="operator-list">
        <li class="operator-item"><span class="status-dot"></span><span>OP_ACTIVE (You)</span></li>
        <li class="operator-item"><span class="status-dot" style="background-color: var(--accent-purple)"></span><span style="color: var(--accent-purple)">SHIP_AI</span></li>
      </ul>
    </div>
  </div>

  <div id="console-bar">
    <span id="prompt-indicator">></span>
    <input type="text" id="cmd-input" placeholder="Enter network message or directive..." autofocus autocomplete="off">
  </div>

  <script>
    const feed = document.getElementById("feed");
    const input = document.getElementById("cmd-input");

    function clean(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ====== PASTE YOUR ORIGINAL FIREBASE CONFIG CODES HERE ======
    const firebaseConfig = {
      apiKey: "YOUR_OLD_API_KEY",
      authDomain: "YOUR_OLD_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_OLD_PROJECT.firebaseio.com",
      projectId: "noble-nation-455601-v2",
      storageBucket: "YOUR_OLD_PROJECT.appspot.com",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };
    // ============================================================

    // Initialize Firebase connectivity if config is supplied
    let database;
    if (firebaseConfig.apiKey !== "YOUR_OLD_API_KEY") {
      firebase.initializeApp(firebaseConfig);
      database = firebase.database();
      
      // RESTORED: Listen for other people typing from their computers
      database.ref("messages").on("child_added", (snapshot) => {
        const data = snapshot.val();
        renderIncomingMessage(data.username, data.text, data.timestamp);
      });
    }

    function renderIncomingMessage(user, text, timeStr) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";
      msgDiv.innerHTML = `
        <div class="msg-meta">
          <span class="user">${clean(user)}</span>
          <span class="time">${timeStr}</span>
        </div>
        <div class="text-payload">${clean(text)}</div>
      `;
      feed.appendChild(msgDiv);
      feed.scrollTop = feed.scrollHeight;
    }

    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const rawText = input.value;
        if (!rawText.trim()) return;

        input.value = "";
        const timestamp = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});

        // Check if it's a command first. If not, sync it globally to everyone via Firebase
        const isCommand = await handleCommand(rawText, timestamp);
        
        if (!isCommand && database) {
          database.ref("messages").push({
            username: "OP_ACTIVE",
            text: rawText,
            timestamp: timestamp
          });
        } else if (!isCommand && !database) {
          // Fallback UI rendering if firebase isn't initialized yet
          renderIncomingMessage("OP_ACTIVE", rawText, timestamp);
        }
      }
    });

    /* ================= SYSTEM CORE COMMAND INTELLIGENCE ================= */
    async function handleCommand(text, timestamp) {
      const cleanText = text.trim();
      const cmd = cleanText.toLowerCase();

      if (cmd === "/clear") {
        feed.innerHTML = "";
        return true;
      }

      if (cmd.startsWith("/theme ")) {
        const selectedTheme = cmd.substring(7).trim();
        document.body.className = "";
        if (selectedTheme === "matrix") document.body.classList.add("theme-matrix");
        if (selectedTheme === "cyber") document.body.classList.add("theme-cyber");
        
        const systemDiv = document.createElement("div");
        systemDiv.className = "msg sys-alert";
        systemDiv.innerHTML = `>> SYSTEM: UI display array reconfigured to [${selectedTheme}].`;
        feed.appendChild(systemDiv);
        feed.scrollTop = feed.scrollHeight;
        return true;
      }

      if (cmd === "/wipe") {
        if (database) database.ref("messages").remove();
        feed.innerHTML = `<div class="msg"><div class="text-payload" style="color: var(--accent-red)">>> CRITICAL: Global logs wiped from database relay.</div></div>`;
        return true;
      }

      // Secure Render AI proxy block
      if (cmd.startsWith("/ai ")) {
        const aiPrompt = cleanText.substring(4).trim();
        if (!aiPrompt) return true;

        const thinkingEl = document.createElement("div");
        thinkingEl.className = "msg";
        thinkingEl.innerHTML = `<div class="text-payload sys-alert">>> SHIP_AI: Query routed through secure Render proxy. Computing...</div>`;
        feed.appendChild(thinkingEl);
        feed.scrollTop = feed.scrollHeight;

        try {
          const res = await fetch("https://pasteitsearchit.onrender.com/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: aiPrompt })
          });
          
          const data = await res.json();
          thinkingEl.remove();

          if (data.error) throw new Error(data.error);

          // Render output visually for all operators on the channel
          const aiPayload = {
            username: "🤖 SHIP_AI",
            text: data.text,
            timestamp: timestamp
          };

          if (database) {
            database.ref("messages").push(aiPayload);
          } else {
            renderIncomingMessage(aiPayload.username, aiPayload.text, aiPayload.timestamp);
          }
          
        } catch (err) {
          thinkingEl.innerHTML = `<div class="text-payload" style="color: var(--accent-red)">>> SUBSYSTEM_FAULT: Core connection refused by Render host container.</div>`;
        }
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
