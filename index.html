<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const messagesRef = ref(db, "messages");

const feed = document.getElementById("feed");
const input = document.getElementById("msgInput");
const usernameBox = document.getElementById("usernameBox");

/* USER */
if (localStorage.getItem("cmd_user")) {
  usernameBox.value = localStorage.getItem("cmd_user");
}

usernameBox.addEventListener("input", () => {
  localStorage.setItem("cmd_user", usernameBox.value);
});

/* RENDER MESSAGE */
function renderMessage(id, data) {
  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.id = id;

  const time = new Date(data.time).toLocaleTimeString();

  div.innerHTML = `
    <span class="user">${data.user}</span>
    <span class="time">[${time}]</span><br>
    ${data.text}
    <br>
    <button onclick="window.deleteMsg('${id}', '${data.user}')">💣 self-destruct</button>
  `;

  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

/* LIVE LOAD */
onChildAdded(messagesRef, (snap) => {
  renderMessage(snap.key, snap.val());
});

/* DELETE FUNCTION (GLOBAL) */
window.deleteMsg = (id, user) => {
  const currentUser = usernameBox.value.trim();

  if (currentUser !== user) {
    alert("You can only delete your own messages.");
    return;
  }

  const msgRef = ref(db, "messages/" + id);
  remove(msgRef);
};

/* SEND MESSAGE */
function send() {
  const user = usernameBox.value.trim() || "anon";
  const text = input.value.trim();

  if (!text) return;

  let delay = 0;
  let finalText = text;

  // OPTIONAL COMMAND: /msg 10s hello
  const match = text.match(/^\/msg\s+(\d+)s\s+(.+)/);

  if (match) {
    delay = parseInt(match[1], 10) * 1000;
    finalText = match[2];
  }

  const newRef = push(messagesRef, {
    user,
    text: finalText,
    time: Date.now()
  });

  input.value = "";

  // AUTO SELF-DESTRUCT TIMER
  if (delay > 0) {
    setTimeout(() => {
      remove(ref(db, "messages/" + newRef.key));
    }, delay);
  }
}

document.getElementById("sendBtn").onclick = send;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
