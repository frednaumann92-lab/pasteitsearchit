<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Network v5 Stable (Fixed)</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #070a0f;
  color: #d7dde8;
}

header {
  background: #0f1622;
  padding: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid #1f2a3a;
}

#layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 85vh;
}

#channels {
  background: #0a0f18;
  padding: 10px;
  border-right: 1px solid #1f2a3a;
}

.channel {
  padding: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
}

#feed {
  padding: 10px;
  overflow-y: auto;
  background: #0c111c;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #2b6cff;
  background: rgba(255,255,255,0.03);
}

#inputBar {
  display: flex;
  padding: 10px;
  gap: 6px;
  background: #0f1622;
  border-top: 1px solid #1f2a3a;
}

input, button {
  font-family: monospace;
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input {
  background: #141c2b;
  color: white;
}

button {
  background: #d32f2f;
  color: white;
  cursor: pointer;
}

#status {
  margin-left: auto;
  padding: 4px 8px;
  background: #111a2a;
  border-radius: 6px;
}

#adminBox {
  display: flex;
  gap: 6px;
}
</style>
</head>

<body>

<header>
  <div>🛰 Command Network v5 Stable</div>

  <div id="adminBox">
    <input id="email" placeholder="admin email" />
    <input id="pass" type="password" placeholder="password" />
    <button id="adminLogin">Admin Login</button>
  </div>

  <button id="logoutBtn">Logout</button>

  <div id="status">starting...</div>
</header>

<div id="layout">

  <div id="channels">
    <div class="channel" data-ch="alpha"># alpha</div>
    <div class="channel" data-ch="bravo"># bravo</div>
    <div class="channel" data-ch="charlie"># charlie</div>
  </div>

  <div id="feed"></div>

</div>

<div id="inputBar">
  <input id="msg" placeholder="message or /wipe" />
  <button id="send">SEND</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signInAnonymously,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307"
});

const db = getDatabase(app);
const auth = getAuth(app);

/* ADMIN UID */
const ADMIN_UIDS = [
  "uiXgz4sgYfo5TjSl1uLc9Xmypk7Xv1"
];

let channel = "alpha";
let user = null;
let role = "guest";
let unsubscribe = null;

/* UI */
const feed = document.getElementById("feed");
const msg = document.getElementById("msg");
const status = document.getElementById("status");

const messagesRef = ch => ref(db, "channels/" + ch);

/* CLEAN LISTENER */
function listen() {
  if (unsubscribe) unsubscribe();
  feed.innerHTML = "";

  unsubscribe = onChildAdded(messagesRef(channel), snap => {
    const d = snap.val();

    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${d.user}</b><br>${d.text}`;

    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  });
}

/* AUTH STATE */
onAuthStateChanged(auth, u => {
  user = u;

  if (!u) {
    status.textContent = "offline";
    role = "none";
    return;
  }

  role =
    ADMIN_UIDS.includes(u.uid) ? "admin" :
    u.isAnonymous ? "guest" : "operator";

  status.textContent = role;

  listen();
});

/* AUTO GUEST LOGIN */
signInAnonymously(auth);

/* ADMIN LOGIN */
document.getElementById("adminLogin").onclick = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  if (!email || !pass) return alert("Enter admin credentials");

  await signInWithEmailAndPassword(auth, email, pass);
};

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  feed.innerHTML = "";
};

/* CHANNEL SWITCH */
document.querySelectorAll(".channel").forEach(el => {
  el.onclick = () => {
    channel = el.dataset.ch;
    listen();
  };
});

/* SEND */
function send() {
  if (!user) return;

  const text = msg.value.trim();
  if (!text) return;

  /* COMMANDS */
  if (role === "admin" && text === "/wipe") {
    remove(messagesRef(channel));
    feed.innerHTML = "";
    msg.value = "";
    return;
  }

  push(messagesRef(channel), {
    user: user.email || "guest",
    text,
    t: Date.now()
  });

  msg.value = "";
}

document.getElementById("send").onclick = send;

msg.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
