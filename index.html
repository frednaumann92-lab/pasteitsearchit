<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Center v3.1</title>

<style>
  body {
    margin: 0;
    font-family: monospace;
    background: #070a0f;
    color: #d7dde8;
  }

  header {
    background: #0f1622;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f2a3a;
  }

  #feed {
    height: 60vh;
    overflow-y: auto;
    padding: 12px;
    background: #0a0f18;
  }

  .msg {
    padding: 8px;
    margin-bottom: 6px;
    border-left: 3px solid #2b6cff;
    background: rgba(255,255,255,0.03);
  }

  .user {
    color: #4dd0e1;
    font-weight: bold;
  }

  .time {
    color: #666;
    font-size: 0.8em;
    margin-left: 6px;
  }

  #inputBar {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #0f1622;
    border-top: 1px solid #1f2a3a;
  }

  input, button {
    font-family: monospace;
    border: none;
    border-radius: 6px;
    padding: 10px;
  }

  input {
    background: #141c2b;
    color: #fff;
  }

  #usernameBox {
    width: 140px;
  }

  #msgInput {
    flex: 1;
  }

  button {
    background: #d32f2f;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #a82525;
  }

  /* presence panel */
  #radar {
    padding: 10px;
    background: #0f1622;
    border-top: 1px solid #1f2a3a;
    font-size: 12px;
    color: #4dd0e1;
    max-height: 20vh;
    overflow-y: auto;
  }
</style>
</head>

<body>

<header>
  <div>🛰 Command Center v3.1</div>
  <div>
    User:
    <input id="usernameBox" placeholder="operator name" />
    <button id="muteBtn">🔊</button>
  </div>
</header>

<div id="feed"></div>
<div id="radar">🟢 OPERATOR GRID: initializing...</div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type message or /command..." />
  <button id="sendBtn">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove,
  set,
  onDisconnect,
  onValue
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const messagesRef = ref(db, "messages");
const presenceRef = ref(db, "presence");

/* ================= UI ================= */
const feed = document.getElementById("feed");
const input = document.getElementById("msgInput");
const usernameBox = document.getElementById("usernameBox");
const muteBtn = document.getElementById("muteBtn");
const radar = document.getElementById("radar");

/* ================= USER ================= */
usernameBox.value = localStorage.getItem("cmd_user") || "";

usernameBox.addEventListener("input", () => {
  localStorage.setItem("cmd_user", usernameBox.value.trim());
  setOnline();
});

/* ================= AUDIO ================= */
let soundEnabled = true;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

document.body.addEventListener("click", () => {
  if (audioCtx.state === "suspended") audioCtx.resume();
});

function tone(freq, duration = 100, type = "sine", volume = 0.05) {
  if (!soundEnabled) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = volume;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  setTimeout(() => osc.stop(), duration);
}

const soundSend = () => tone(520, 60, "square");
const soundReceive = () => tone(880, 80, "sine");
const soundCommand = () => tone(660, 90, "triangle");
const soundDanger = () => tone(140, 300, "sawtooth", 0.08);

muteBtn.onclick = () => {
  soundEnabled = !soundEnabled;
  muteBtn.textContent = soundEnabled ? "🔊" : "🔇";
};

/* ================= SAFE TEXT ================= */
function clean(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

/* ================= MESSAGES ================= */
let lastKey = null;

function addMessage(data, key) {
  const div = document.createElement("div");
  div.className = "msg";

  const time = new Date(data.time).toLocaleTimeString();

  div.innerHTML = `
    <span class="user">${clean(data.user)}</span>
    <span class="time">[${time}]</span><br>
    ${clean(data.text)}
  `;

  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;

  lastKey = key;
}

onChildAdded(messagesRef, (snap) => {
  addMessage(snap.val(), snap.key);
  soundReceive();
});

/* ================= PRESENCE ================= */
const myId = crypto.randomUUID?.() || String(Date.now());
const myPresenceRef = ref(db, `presence/${myId}`);

function setOnline() {
  const name = usernameBox.value.trim() || "anon";

  set(myPresenceRef, {
    user: name,
    status: "online",
    lastSeen: Date.now()
  });

  onDisconnect(myPresenceRef).set({
    user: name,
    status: "offline",
    lastSeen: Date.now()
  });
}

setOnline();

/* live radar */
onValue(presenceRef, (snap) => {
  const data = snap.val() || {};

  const online = Object.values(data).filter(u => u.status === "online");

  radar.innerHTML = `
    🟢 ONLINE OPERATORS (${online.length})<br><br>
    ${online.map(u => "• " + clean(u.user)).join("<br>")}
  `;
});

/* ================= COMMANDS ================= */
function handleCommand(text) {
  const cmd = text.toLowerCase();

  if (cmd === "/clear") {
    feed.innerHTML = "";
    return true;
  }

  if (cmd === "/del last") {
    if (lastKey) {
      remove(ref(db, "messages/" + lastKey));
      feed.lastChild?.remove();
    }
    return true;
  }

  if (cmd === "/wipe") {
    soundDanger();
    remove(messagesRef);
    feed.innerHTML = "";
    return true;
  }

  return false;
}

/* ================= SEND ================= */
function send() {
  const user = usernameBox.value.trim() || "anon";
  const text = input.value.trim();

  if (!text) return;

  if (handleCommand(text)) {
    soundCommand();
    input.value = "";
    return;
  }

  push(messagesRef, {
    user,
    text,
    time: Date.now()
  });

  soundSend();
  input.value = "";
}

document.getElementById("sendBtn").onclick = send;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
