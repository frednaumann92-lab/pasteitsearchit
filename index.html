<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Network v4.6 Login Gate</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #070a0f;
  color: #d7dde8;
}

/* LOGIN OVERLAY */
#authScreen {
  position: fixed;
  inset: 0;
  background: #05070c;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  z-index: 999;
}

#authBox {
  background: #0f1622;
  padding: 20px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 280px;
}

input, button {
  font-family: monospace;
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input {
  background: #141c2b;
  color: white;
}

button {
  background: #d32f2f;
  color: white;
  cursor: pointer;
}

/* MAIN APP */
#app {
  display: none;
}

header {
  background: #0f1622;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #1f2a3a;
}

#layout {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  height: 85vh;
}

#channels {
  background: #0a0f18;
  padding: 10px;
}

.channel {
  padding: 8px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.03);
  cursor: pointer;
}

#feed {
  padding: 10px;
  overflow-y: auto;
  background: #0c111c;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #2b6cff;
  background: rgba(255,255,255,0.03);
}

#inputBar {
  display: flex;
  padding: 10px;
  gap: 6px;
  background: #0f1622;
  border-top: 1px solid #1f2a3a;
}

#msg {
  flex: 1;
  background: #141c2b;
  color: white;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="authScreen">
  <h2>🛰 Command Network</h2>

  <div id="authBox">
    <input id="email" placeholder="email" />
    <input id="pass" type="password" placeholder="password" />

    <button id="loginBtn">Login</button>
    <button id="guestBtn">Enter as Guest</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">

<header>
  <div>🛰 Command Network v4.6</div>
  <div id="status">offline</div>
</header>

<div id="layout">
  <div id="channels">
    <div class="channel" data-ch="alpha"># alpha</div>
    <div class="channel" data-ch="bravo"># bravo</div>
  </div>

  <div id="feed"></div>
  <div></div>
</div>

<div id="inputBar">
  <input id="msg" placeholder="message..." />
  <button id="send">SEND</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307"
});

const db = getDatabase(app);
const auth = getAuth(app);

/* STATE */
let channel = "alpha";
let user = null;

/* UI */
const authScreen = document.getElementById("authScreen");
const appUI = document.getElementById("app");
const status = document.getElementById("status");
const feed = document.getElementById("feed");
const msg = document.getElementById("msg");

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      email.value,
      pass.value
    );
  } catch(e) {
    alert("Login failed");
    console.error(e);
  }
};

/* GUEST */
document.getElementById("guestBtn").onclick = async () => {
  await signInAnonymously(auth);
};

/* AUTH STATE */
onAuthStateChanged(auth, u => {
  if (!u) return;

  user = u;

  authScreen.style.display = "none";
  appUI.style.display = "block";

  status.textContent = u.isAnonymous ? "guest" : "user";

  listen();
});

/* DB */
const messagesRef = ch => ref(db, "channels/" + ch);

/* LISTEN */
function listen() {
  feed.innerHTML = "";

  onChildAdded(messagesRef(channel), snap => {
    const d = snap.val();

    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${d.user}</b><br>${d.text}`;

    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  });
}

/* CHANNEL SWITCH */
document.querySelectorAll(".channel").forEach(el => {
  el.onclick = () => {
    channel = el.dataset.ch;
    listen();
  };
});

/* SEND */
document.getElementById("send").onclick = () => {
  if (!user) return;

  const text = msg.value.trim();
  if (!text) return;

  push(messagesRef(channel), {
    user: user.email || "guest",
    text,
    t: Date.now()
  });

  msg.value = "";
};

/* ENTER KEY */
msg.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById("send").click();
  }
});

</script>

</body>
</html>
