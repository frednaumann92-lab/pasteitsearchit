<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Command Deck</title>
  <style>
    :root {
      --bg-main: #0d0e12;
      --bg-panel: #16171d;
      --border-color: #262930;
      --text-main: #e2e4e9;
      --text-muted: #626775;
      --accent-green: #00ff66;
      --accent-purple: #bc6ff1;
      --accent-red: #ff3333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px;
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .msg {
      margin-bottom: 12px;
      line-height: 1.5;
      padding-left: 8px;
    }
    .msg-meta {
      font-size: 0.85em;
      margin-bottom: 3px;
    }
    .user { color: var(--accent-green); font-weight: bold; }
    .time { color: var(--text-muted); margin-left: 8px; }
    .text-payload { white-space: pre-wrap; word-break: break-word; }
    .sys-alert { color: var(--accent-purple); }
    #console-bar {
      display: flex;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      align-items: center;
    }
    #prompt-indicator {
      color: var(--accent-green);
      font-weight: bold;
      margin-right: 10px;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1em;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="feed">
    <div class="msg">
      <div class="msg-meta"><span class="user">[SYSTEM]</span><span class="time">CORE_READY</span></div>
      <div class="text-payload sys-alert">>> Secure terminal channel initialized. Secure Render proxy active.</div>
      <div class="text-payload sys-alert">>> Type /ai [your prompt] to query the subsystem grid.</div>
    </div>
  </div>

  <div id="console-bar">
    <span id="prompt-indicator">></span>
    <input type="text" id="cmd-input" placeholder="Enter routing vector or /ai query..." autofocus autocomplete="off">
  </div>

  <script>
    const feed = document.getElementById("feed");
    const input = document.getElementById("cmd-input");

    // helper text sanitizer to prevent layout script breaks
    function clean(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const rawText = input.value;
        if (!rawText.trim()) return;

        // print what the operator typed into the main feed panel
        const userDiv = document.createElement("div");
        userDiv.className = "msg";
        userDiv.innerHTML = `
          <div class="msg-meta">
            <span class="user">OP_ACTIVE</span>
            <span class="time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <div class="text-payload">${clean(rawText)}</div>
        `;
        feed.appendChild(userDiv);
        input.value = "";
        feed.scrollTop = feed.scrollHeight;

        // process commands execution sequence
        await handleCommand(rawText);
      }
    });

    /* ================= SYSTEM CORE COMMAND INTELLIGENCE ================= */
    async function handleCommand(text) {
      const cleanText = text.trim();
      const cmd = cleanText.toLowerCase();

      // Clear layout command
      if (cmd === "/clear") {
        feed.innerHTML = "";
        return true;
      }

      // Secure Render AI processing module
      if (cmd.startsWith("/ai ")) {
        const aiPrompt = cleanText.substring(4).trim();
        if (!aiPrompt) return true;

        // 1. Instantiates visual holding matrix entry on interface screen
        const thinkingEl = document.createElement("div");
        thinkingEl.className = "msg";
        thinkingEl.innerHTML = `<div class="text-payload sys-alert">>> SHIP_AI: Query routed through secure Render proxy. Computing...</div>`;
        feed.appendChild(thinkingEl);
        feed.scrollTop = feed.scrollHeight;

        try {
          // 2. Transports data packet to your secure free backend platform server
          const res = await fetch("https://pasteitsearchit.onrender.com/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: aiPrompt })
          });
          
          const data = await res.json();
          thinkingEl.remove(); // removes holding matrix banner

          if (data.error) throw new Error(data.error);

          // 3. Spits the return text block out onto the UI grid panel layer
          const aiDiv = document.createElement("div");
          aiDiv.className = "msg";
          aiDiv.style.borderLeft = "3px solid var(--accent-purple)";
          aiDiv.innerHTML = `
            <div class="msg-meta">
              <span class="user" style="color: var(--accent-purple)">🤖 SHIP_AI</span>
              <span class="time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
            </div>
            <div class="text-payload">${clean(data.text)}</div>
          `;
          feed.appendChild(aiDiv);
          
        } catch (err) {
          thinkingEl.innerHTML = `<div class="text-payload" style="color: var(--accent-red)">>> SUBSYSTEM_FAULT: Core connection refused by Render proxy container.</div>`;
        }
        feed.scrollTop = feed.scrollHeight;
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
