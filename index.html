<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save and Search (Live)</title>

<style>
  body {
    font-family: monospace;
    max-width: 900px;
    margin: 20px auto 80px;
    background: #f0f4f8;
    color: #000;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
  }

  body.dark {
    background: #0f1115;
    color: #e6e6e6;
  }

  h1 { margin-bottom: 10px; }

  textarea, input[type=text] {
    width: 100%;
    font-family: monospace;
    font-size: 1em;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: inherit;
    color: inherit;
    box-sizing: border-box;
  }

  body.dark textarea,
  body.dark input[type=text] {
    border-color: #444;
    background: #1a1d24;
  }

  textarea { height: 180px; resize: vertical; }

  button {
    background: #d32f2f;
    border: none;
    color: white;
    padding: 7px 14px;
    margin: 5px 5px 10px 0;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover { background: #9a2222; }

  #results {
    background: #fff;
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 6px;
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  body.dark #results {
    background: #161a22;
    border-color: #333;
  }

  #clock {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2.5em;
    padding: 6px 12px;
    border-radius: 10px;
    background: #eee;
    color: #111;
  }

  body.dark #clock {
    background: #222;
    color: #eee;
  }
</style>
</head>

<body>

<h1>Save and Search (Live Firebase)</h1>

<label>
  🌙 Dark Mode
  <input type="checkbox" id="darkToggle">
</label>

<textarea id="pasteArea" placeholder="Type or paste text..."></textarea>

<input id="searchTerm" placeholder="Search (comma separated)" />

<button id="clearBtn">Clear</button>
<button id="copyBtn">Copy</button>
<button id="exportBtn">Export</button>
<button id="printBtn">Print</button>

<div id="results"></div>
<div id="clock">00:00:00</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const sharedRef = ref(db, "sharedText");

const pasteArea = document.getElementById("pasteArea");
const searchTerm = document.getElementById("searchTerm");
const results = document.getElementById("results");
const darkToggle = document.getElementById("darkToggle");

let isRemoteUpdate = false;

/* LOAD LIVE DATA */
onValue(sharedRef, (snap) => {
  const val = snap.val();
  if (val !== null) {
    isRemoteUpdate = true;
    pasteArea.value = val;
    runSearch();
    setTimeout(() => isRemoteUpdate = false, 50);
  }
});

/* SAVE TEXT */
pasteArea.addEventListener("input", () => {
  if (!isRemoteUpdate) {
    set(sharedRef, pasteArea.value);
  }
  runSearch();
});

/* SEARCH */
function runSearch() {
  const text = pasteArea.value;
  const terms = searchTerm.value
    .split(",")
    .map(t => t.trim())
    .filter(Boolean);

  const lines = text.split("\n").filter(line =>
    terms.some(t => line.toLowerCase().includes(t.toLowerCase()))
  );

  results.textContent = lines.length ? lines.join("\n") : "No matches";
}

searchTerm.addEventListener("input", runSearch);

/* DARK MODE */
darkToggle.addEventListener("change", () => {
  document.body.classList.toggle("dark", darkToggle.checked);
  localStorage.setItem("darkMode", darkToggle.checked);
});

/* LOAD DARK MODE */
if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark");
  darkToggle.checked = true;
}

/* BUTTONS */
document.getElementById("clearBtn").onclick = () => {
  searchTerm.value = "";
  results.textContent = "";
};

document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(results.textContent || "");
};

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([pasteArea.value], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shared.txt";
  a.click();
};

document.getElementById("printBtn").onclick = () => {
  const w = window.open();
  w.document.write(`<pre>${results.textContent}</pre>`);
  w.print();
};

/* CLOCK */
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toTimeString().split(" ")[0];
}, 1000);

</script>

</body>
</html>
