<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Command Deck</title>

  <!-- ✅ FIREBASE MUST LOAD FIRST -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-main: #0d0e12;
      --bg-panel: #16171d;
      --border-color: #262930;
      --text-main: #e2e4e9;
      --text-muted: #626775;
      --accent-green: #00ff66;
      --accent-purple: #bc6ff1;
      --accent-red: #ff3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow: hidden;
    }

    #workspace {
      display: flex;
      flex: 1;
      gap: 10px;
      min-height: 0;
    }

    #feed {
      flex: 3;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    #online-panel {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px;
      overflow-y: auto;
    }

    .panel-header {
      font-weight: bold;
      color: var(--accent-green);
      margin-bottom: 10px;
    }

    .msg {
      margin-bottom: 10px;
      padding-left: 6px;
    }

    .user {
      color: var(--accent-green);
      font-weight: bold;
    }

    .time {
      color: var(--text-muted);
      margin-left: 8px;
      font-size: 0.8em;
    }

    .text {
      margin-top: 3px;
      white-space: pre-wrap;
    }

    .operator {
      margin-bottom: 6px;
      color: var(--text-main);
    }

    #console-bar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-top: 10px;
    }

    #prompt {
      color: var(--accent-green);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: monospace;
    }
  </style>
</head>

<body>

<div id="workspace">
  <div id="feed"></div>

  <div id="online-panel">
    <div class="panel-header">ACTIVE OPERATORS</div>
    <div id="users"></div>
  </div>
</div>

<div id="console-bar">
  <span id="prompt">></span>
  <input id="input" placeholder="message or /command..." />
</div>

<script>
/* ================= FIREBASE INIT ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBDQGlsajY4iMxlJvZUfEvm9CnBKnHcD78",
  authDomain: "shared-notes-f6307.firebaseapp.com",
  databaseURL: "https://shared-notes-f6307-default-rtdb.firebaseio.com",
  projectId: "shared-notes-f6307",
  storageBucket: "shared-notes-f6307.firebasestorage.app",
  messagingSenderId: "51317483112",
  appId: "1:51317483112:web:7767ef1f15f473ce98bddd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= UI ================= */
const feed = document.getElementById("feed");
const input = document.getElementById("input");
const users = document.getElementById("users");

/* ================= USER IDENTITY ================= */
const myId = localStorage.getItem("op_id") || crypto.randomUUID();
localStorage.setItem("op_id", myId);

let username = localStorage.getItem("op_name") || "OPERATOR";

/* ================= USERNAME EDIT (LIVE) ================= */
const nameBox = document.createElement("input");
nameBox.value = username;
nameBox.style.marginLeft = "10px";
nameBox.style.width = "120px";
document.getElementById("console-bar").prepend(nameBox);

nameBox.addEventListener("input", () => {
  username = nameBox.value.trim() || "OPERATOR";
  localStorage.setItem("op_name", username);
  updatePresence();
});

/* ================= PRESENCE ================= */
const presenceRef = db.ref("presence/" + myId);

function updatePresence() {
  presenceRef.set({
    username,
    status: "online",
    t: Date.now()
  });

  presenceRef.onDisconnect().set({
    username,
    status: "offline",
    t: Date.now()
  });
}

updatePresence();

/* ================= MESSAGES ================= */
function render(user, text, time) {
  const div = document.createElement("div");
  div.className = "msg";

  div.innerHTML = `
    <div>
      <span class="user">${user}</span>
      <span class="time">${time}</span>
    </div>
    <div class="text">${text}</div>
  `;

  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

/* LIVE MESSAGES */
db.ref("messages").on("child_added", snap => {
  const d = snap.val();
  render(d.username, d.text, d.timestamp);
});

/* ================= PRESENCE LIST ================= */
db.ref("presence").on("value", snap => {
  users.innerHTML = "";

  snap.forEach(child => {
    const u = child.val();
    const div = document.createElement("div");
    div.className = "operator";
    div.textContent = "• " + u.username + (u.status === "online" ? " (online)" : "");
    users.appendChild(div);
  });
});

/* ================= COMMANDS ================= */
function handleCommand(cmd) {
  cmd = cmd.toLowerCase();

  if (cmd === "/clear") {
    feed.innerHTML = "";
    return true;
  }

  if (cmd === "/wipe") {
    db.ref("messages").remove();
    feed.innerHTML = "";
    return true;
  }

  return false;
}

/* ================= SEND ================= */
input.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;

  const text = input.value.trim();
  if (!text) return;

  input.value = "";

  if (handleCommand(text)) return;

  db.ref("messages").push({
    username,
    text,
    timestamp: new Date().toLocaleTimeString()
  });
});
</script>

</body>
</html>
