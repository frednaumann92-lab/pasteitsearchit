<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Command Deck</title>
  <style>
    :root {
      --bg-main: #0d0e12;
      --bg-panel: #16171d;
      --border-color: #262930;
      --text-main: #e2e4e9;
      --text-muted: #626775;
      --accent-green: #00ff66;
      --accent-purple: #bc6ff1;
      --accent-red: #ff3333;
    }
    
    /* Alternate Matrix Green Theme */
    .theme-matrix {
      --bg-main: #020202;
      --bg-panel: #050805;
      --border-color: #0f2d11;
      --text-main: #33ff33;
      --text-muted: #145a19;
      --accent-green: #33ff33;
      --accent-purple: #00ff66;
    }

    /* Alternate High-Contrast Cyberpunk Theme */
    .theme-cyber {
      --bg-main: #0e0014;
      --bg-panel: #1a0026;
      --border-color: #ff0055;
      --text-main: #00f0ff;
      --text-muted: #730046;
      --accent-green: #00f0ff;
      --accent-purple: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px;
      transition: background-color 0.2s, color 0.2s;
    }
    
    #workspace {
      display: flex;
      flex: 1;
      gap: 10px;
      margin-bottom: 10px;
      min-height: 0;
    }

    #feed {
      flex: 3;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    #online-panel {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      font-weight: bold;
      color: var(--accent-green);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      margin-bottom: 10px;
      font-size: 0.9em;
    }

    .operator-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9em;
    }

    .operator-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
    }

    .msg {
      margin-bottom: 12px;
      line-height: 1.5;
      padding-left: 8px;
    }
    .msg-meta {
      font-size: 0.85em;
      margin-bottom: 3px;
    }
    .user { color: var(--accent-green); font-weight: bold; }
    .time { color: var(--text-muted); margin-left: 8px; }
    .text-payload { white-space: pre-wrap; word-break: break-word; }
    .sys-alert { color: var(--accent-purple); }
    
    #console-bar {
      display: flex;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      align-items: center;
    }
    #prompt-indicator {
      color: var(--accent-green);
      font-weight: bold;
      margin-right: 10px;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1em;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="workspace">
    <div id="feed">
      <div class="msg">
        <div class="msg-meta"><span class="user">[SYSTEM]</span><span class="time">CORE_READY</span></div>
        <div class="text-payload sys-alert">>> Secure terminal active. Multi-terminal networking operational.</div>
        <div class="text-payload sys-alert">>> Available Directives: /ai [query] | /theme [matrix/cyber/default] | /clear | /wipe</div>
      </div>
    </div>

    <div id="online-panel">
      <div class="panel-header">ACTIVE_OPERATORS</div>
      <ul class="operator-list">
        <li class="operator-item"><span class="status-dot"></span><span>OP_ACTIVE (You)</span></li>
        <li class="operator-item"><span class="status-dot" style="background-color: var(--accent-purple)"></span><span style="color: var(--accent-purple)">SHIP_AI</span></li>
      </ul>
    </div>
  </div>

  <div id="console-bar">
    <span id="prompt-indicator">></span>
    <input type="text" id="cmd-input" placeholder="Enter routing vector or directive..." autofocus autocomplete="off">
  </div>

  <script>
    const feed = document.getElementById("feed");
    const input = document.getElementById("cmd-input");

    function clean(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const rawText = input.value;
        if (!rawText.trim()) return;

        // Print local input securely
        const userDiv = document.createElement("div");
        userDiv.className = "msg";
        userDiv.innerHTML = `
          <div class="msg-meta">
            <span class="user">OP_ACTIVE</span>
            <span class="time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <div class="text-payload">${clean(rawText)}</div>
        `;
        feed.appendChild(userDiv);
        input.value = "";
        feed.scrollTop = feed.scrollHeight;

        await handleCommand(rawText);
      }
    });

    /* ================= SYSTEM CORE COMMAND INTELLIGENCE ================= */
    async function handleCommand(text) {
      const cleanText = text.trim();
      const cmd = cleanText.toLowerCase();

      // Local UI Clear Command
      if (cmd === "/clear") {
        feed.innerHTML = "";
        return true;
      }

      // Re-added Theme Matrix Engine
      if (cmd.startsWith("/theme ")) {
        const selectedTheme = cmd.substring(7).trim();
        document.body.className = ""; // Reset
        if (selectedTheme === "matrix") document.body.classList.add("theme-matrix");
        if (selectedTheme === "cyber") document.body.classList.add("theme-cyber");
        
        const systemDiv = document.createElement("div");
        systemDiv.className = "msg sys-alert";
        systemDiv.innerHTML = `>> SYSTEM: UI display array reconfigured to [${selectedTheme}].`;
        feed.appendChild(systemDiv);
        feed.scrollTop = feed.scrollHeight;
        return true;
      }

      // Re-added Global Content Wipe Command
      if (cmd === "/wipe") {
        feed.innerHTML = `<div class="msg"><div class="text-payload" style="color: var(--accent-red)">>> CRITICAL: Global logs wiped by operator authority.</div></div>`;
        // Note: Put your Firebase database wipe call here if you sync deletions across users!
        return true;
      }

      // Secure Render AI proxy system
      if (cmd.startsWith("/ai ")) {
        const aiPrompt = cleanText.substring(4).trim();
        if (!aiPrompt) return true;

        const thinkingEl = document.createElement("div");
        thinkingEl.className = "msg";
        thinkingEl.innerHTML = `<div class="text-payload sys-alert">>> SHIP_AI: Query routed through secure Render proxy. Computing...</div>`;
        feed.appendChild(thinkingEl);
        feed.scrollTop = feed.scrollHeight;

        try {
          const res = await fetch("https://pasteitsearchit.onrender.com/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: aiPrompt })
          });
          
          const data = await res.json();
          thinkingEl.remove();

          if (data.error) throw new Error(data.error);

          const aiDiv = document.createElement("div");
          aiDiv.className = "msg";
          aiDiv.style.borderLeft = "3px solid var(--accent-purple)";
          aiDiv.innerHTML = `
            <div class="msg-meta">
              <span class="user" style="color: var(--accent-purple)">🤖 SHIP_AI</span>
              <span class="time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
            </div>
            <div class="text-payload">${clean(data.text)}</div>
          `;
          feed.appendChild(aiDiv);
          
        } catch (err) {
          thinkingEl.innerHTML = `<div class="text-payload" style="color: var(--accent-red)">>> SUBSYSTEM_FAULT: Core connection refused by Render host container.</div>`;
        }
        feed.scrollTop = feed.scrollHeight;
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
